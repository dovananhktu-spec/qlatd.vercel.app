<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Sổ dụng cụ cách điện</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Bố cục: khung ứng dụng ba cột. Trái: bộ lọc nhanh. Giữa: tab Tổng quan, Danh sách, Lịch thử, Hoạt động. Phải: tóm tắt và lịch sắp tới. */
:root{
  --font-ui:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --bg:#F3F4F6;
  --surface:#FFFFFF;
  --surface-2:#F7F8FA;
  --surface-3:#EEF0F4;
  --fg:#12161D;
  --muted:#667085;
  --line:#E4E7EC;
  --accent:#2A78D6;
  --accent-fg:#FFFFFF;
  --accent-soft:#E8F1FC;
  --t-boot:#6250D6;
  --t-glove:#EB6834;
  --t-pole:#1BAF7A;
  --t-mat:#EDA100;
  --crit:#D03B3B;
  --warn-mark:#EDA100;
  --ok-mark:#1BAF7A;
  --bad:#B42318;
  --bad-bg:#FDECEA;
  --warn:#7A4E00;
  --warn-bg:#FFF1CC;
  --warn-line:#D99A00;
  --ok:#17653A;
  --ok-bg:#E1F4E8;
  --hatch:rgba(18,22,29,.09);
  --dot:rgba(18,22,29,.16);
  --g1:#F9D3DE;
  --g2:#D3DEFB;
  --g3:#FBE9BE;
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1117;--surface:#151B24;--surface-2:#1A212C;--surface-3:#222B38;--fg:#EAEEF4;--muted:#98A2B3;--line:#283241;
    --accent:#3987E5;--accent-fg:#0B1220;--accent-soft:#1A2B44;
    --t-boot:#9085E9;--t-glove:#D95926;--t-pole:#199E70;--t-mat:#C98500;
    --crit:#E66767;--warn-mark:#C98500;--ok-mark:#199E70;
    --bad:#FF8A80;--bad-bg:#3A1C1A;--warn:#F2C24B;--warn-bg:#352A0E;--warn-line:#C99A1D;--ok:#6FD39A;--ok-bg:#13301F;
    --hatch:rgba(255,255,255,.09);--dot:rgba(255,255,255,.18);
    --g1:#4A2A37;--g2:#25355E;--g3:#4C3F1D;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1117;--surface:#151B24;--surface-2:#1A212C;--surface-3:#222B38;--fg:#EAEEF4;--muted:#98A2B3;--line:#283241;
  --accent:#3987E5;--accent-fg:#0B1220;--accent-soft:#1A2B44;
  --t-boot:#9085E9;--t-glove:#D95926;--t-pole:#199E70;--t-mat:#C98500;
  --crit:#E66767;--warn-mark:#C98500;--ok-mark:#199E70;
  --bad:#FF8A80;--bad-bg:#3A1C1A;--warn:#F2C24B;--warn-bg:#352A0E;--warn-line:#C99A1D;--ok:#6FD39A;--ok-bg:#13301F;
  --hatch:rgba(255,255,255,.09);--dot:rgba(255,255,255,.18);
  --g1:#4A2A37;--g2:#25355E;--g3:#4C3F1D;
  color-scheme:dark;
}

*{box-sizing:border-box}
body{
  background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:14px;line-height:1.5;font-feature-settings:"cv08" 1;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:16px 40px;
}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg{flex:none}

/* Khung ba cột */
.app{max-width:1440px;margin:0 auto;display:grid;grid-template-columns:232px minmax(0,1fr) 312px;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.side{border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.main{min-width:0;display:flex;flex-direction:column}
.rail{border-left:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:16px;min-width:0;background:var(--surface)}

/* Thanh bên */
.side-head{display:flex;align-items:center;justify-content:space-between;padding:2px 8px 8px;font-weight:600;font-size:15px}
.side-head svg{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:13.5px;min-height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:30px;padding:0 10px;font-size:13px}
.btn.wide{width:100%;justify-content:flex-start;margin-bottom:8px}
.btn:disabled{opacity:.55;cursor:default}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-item{appearance:none;border:0;background:transparent;display:flex;align-items:center;gap:10px;width:100%;min-height:34px;padding:0 10px;border-radius:8px;cursor:pointer;text-align:left;color:var(--fg)}
.nav-item:hover{background:var(--surface-2)}
.nav-item[aria-current="true"]{background:var(--surface-3);font-weight:600}
.nav-item svg{color:var(--muted)}
.nav-item .cnt{margin-left:auto;color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
.nav-item .tdot{color:var(--c)}
.side-sec{margin-top:14px;padding:0 10px 4px;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.side-note{padding:4px 10px;color:var(--muted);font-size:13px;display:flex;justify-content:space-between;gap:8px}
.side-note b{color:var(--fg);font-weight:600}
.side-foot{margin-top:auto;padding-top:16px}

/* Tiêu đề và tab */
.mhead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;padding:14px 20px}
.mtitle{display:flex;align-items:center;gap:10px;min-width:0}
.mtitle svg{color:var(--muted)}
.mtitle h1{font-size:17px;font-weight:600}
.mmeta{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:12.5px;font-weight:500;color:var(--muted);background:var(--surface);white-space:nowrap}
.chip svg{color:var(--muted)}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.chip.live .dot{background:var(--ok-mark)}
.only-narrow{display:none}
.notice{margin:0 20px 8px;background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-line);border-radius:10px;padding:8px 14px;font-size:13.5px}
.tabs{display:flex;gap:4px;padding:0 20px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{appearance:none;border:0;border-bottom:2px solid transparent;background:transparent;display:inline-flex;align-items:center;gap:8px;padding:10px 12px;margin-bottom:-1px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
.tab:hover{color:var(--fg)}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--fg);font-weight:600}
.view{padding:20px;display:flex;flex-direction:column;gap:20px;min-width:0}
.sec{font-size:16px;font-weight:600}
.sec-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px}
.sec-row .meta{color:var(--muted);font-size:13px;display:inline-flex;align-items:center;gap:6px}

/* Thẻ chỉ số */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.kpi{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:var(--radius);padding:16px;background:var(--surface);min-width:0}
.kpi::after{content:"";position:absolute;right:-6px;bottom:-6px;width:130px;height:90px;background-image:radial-gradient(var(--dot) 1px,transparent 1.3px);background-size:9px 9px;-webkit-mask-image:linear-gradient(to top left,#000,transparent 80%);mask-image:linear-gradient(to top left,#000,transparent 80%);pointer-events:none}
.kpi-top{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--muted);font-size:13px}
.kpi-top .l{display:inline-flex;align-items:center;gap:6px}
.kpi-ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.kpi-val{font-size:36px;line-height:1.15;font-weight:600;margin-top:8px;font-variant-numeric:tabular-nums}
.kpi-delta{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;margin-top:4px;color:var(--muted)}
.kpi-delta.up{color:var(--ok)}
.kpi-delta.bad{color:var(--bad)}
.kpi-delta.warn{color:var(--warn)}

/* Dải tình trạng */
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.cell-s{appearance:none;border:0;background:var(--surface);display:flex;align-items:center;gap:12px;padding:12px 14px;text-align:left;cursor:pointer;min-width:0}
.cell-s:hover{background:var(--surface-2)}
.cell-s .t{display:flex;flex-direction:column;min-width:0}
.cell-s .t b{font-weight:600}
.cell-s .t span{color:var(--muted);font-size:12.5px}
.ring text{font-size:12px;font-weight:600;fill:var(--fg);font-variant-numeric:tabular-nums}

/* Biểu đồ */
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.card{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);min-width:0}
.chart{padding:16px;display:flex;flex-direction:column;gap:12px}
.card-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 12px}
.card-head h3{font-size:14.5px;font-weight:600}
.card-head p{color:var(--muted);font-size:12.5px}
.legend{display:flex;gap:12px;color:var(--muted);font-size:12.5px;align-items:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.big{display:flex;align-items:baseline;gap:8px}
.big b{font-size:32px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.big span{color:var(--muted)}
.bars{display:flex;gap:10px;align-items:stretch;position:relative}
.bcol{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px;border-radius:8px;padding:4px 2px;outline-offset:0}
.bcol:hover,.bcol:focus-visible{background:var(--surface-2)}
.bval{font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;height:18px}
.bval.zero{color:var(--muted);font-weight:500}
.track{position:relative;width:100%;max-width:56px;height:164px;border-radius:6px;display:flex;align-items:flex-end;background:repeating-linear-gradient(135deg,transparent 0 6px,var(--hatch) 6px 7px)}
.fill{width:100%;border-radius:4px 4px 0 0;background:var(--c,var(--accent));min-height:0}
.fill.has{min-height:4px}
.blabel{font-size:12.5px;color:var(--muted);text-align:center;line-height:1.3}
.blabel b{display:block;color:var(--fg);font-weight:600}
.target{position:absolute;left:0;right:0;top:26px;border-top:1px dashed var(--muted);pointer-events:none}
.target span{position:absolute;right:0;top:-18px;font-size:11.5px;color:var(--muted);background:var(--surface);padding-left:6px}
.tip{position:fixed;z-index:60;background:var(--fg);color:var(--bg);padding:5px 10px;border-radius:6px;font-size:12.5px;font-weight:500;pointer-events:none;max-width:260px}

/* Hoạt động */
.plantbar{display:flex;flex-wrap:wrap;gap:8px;padding:4px 20px 12px}
.pbtn{appearance:none;display:inline-flex;align-items:center;gap:8px;min-height:38px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;font-weight:500}
.pbtn:hover{background:var(--surface-2)}
.pbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.pbtn .pc{font-variant-numeric:tabular-nums;opacity:.8;font-size:12.5px}
.pbtn .pbad{background:var(--bad-bg);color:var(--bad);border-radius:999px;padding:0 8px;font-size:12px;font-weight:600}
.pcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.pcard{appearance:none;text-align:left;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:10px;min-width:0}
.pcard:hover{background:var(--surface-2);border-color:var(--accent)}
.pc-top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.pc-top b{font-size:15px;font-weight:600}
.pc-open{display:inline-flex;align-items:center;gap:4px;color:var(--accent);font-size:13px;font-weight:600;white-space:nowrap}
.pc-num{display:flex;align-items:baseline;gap:8px}
.pc-num b{font-size:34px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.pc-num span{color:var(--muted)}
.pc-bar{display:flex;gap:2px;height:8px;border-radius:999px;overflow:hidden;background:var(--surface-3)}
.pc-bar i{display:block;min-width:4px}
.pc-legend{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:12.5px}
.pc-legend span{display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.pc-legend em{width:8px;height:8px;border-radius:50%;background:var(--c);display:inline-block}
.pills{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.pills button{appearance:none;border:0;background:transparent;padding:0 12px;min-height:30px;cursor:pointer;font-size:13px;color:var(--muted);font-weight:500}
.pills button[aria-pressed="true"]{background:var(--surface-3);color:var(--fg);font-weight:600}
.link{appearance:none;border:0;background:transparent;color:var(--accent);font-weight:600;cursor:pointer;padding:4px 2px}
.alist{border-top:1px solid var(--line)}
.arow{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer;background:transparent;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.arow:hover{background:var(--surface-2)}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--surface))}
.a-main{font-weight:500;min-width:0;overflow-wrap:anywhere}
.a-sub{color:var(--muted);font-size:12.5px}
.badge{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;background:var(--surface-3);color:var(--muted);white-space:nowrap}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.badge.bad{background:var(--bad-bg);color:var(--bad)}
.badge.info{background:var(--accent-soft);color:var(--accent)}

/* Danh sách */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.toolbar .search{flex:1 1 220px;min-width:0;position:relative}
.toolbar .search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.toolbar .search input{padding-left:34px}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:36px;width:100%;min-width:0}
textarea{resize:vertical}
input:disabled,select:disabled,textarea:disabled{background:var(--surface-2);color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;max-width:100%;overflow-x:auto}
.seg button{appearance:none;border:0;border-right:1px solid var(--line);background:transparent;padding:0 12px;min-height:34px;cursor:pointer;font-weight:500;white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--surface-2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.tbl-wrap{border:1px solid var(--line);border-radius:12px;overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;min-width:860px}
.tbl th{text-align:left;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl td:first-child{box-shadow:inset 4px 0 0 var(--stripe,transparent)}
.tbl tr.r-fail,.tbl tr.r-overdue{--stripe:var(--crit)}
.tbl tr.r-soon{--stripe:var(--warn-line)}
.tbl tr.r-ok{--stripe:var(--ok-mark)}
.tname{display:inline-flex;align-items:center;gap:8px}
.tname i{width:9px;height:9px;border-radius:3px;background:var(--c);flex:none}
.serial{font-family:var(--font-mono);font-weight:500;font-size:13px;letter-spacing:.01em;overflow-wrap:anywhere}
.sub{display:block;color:var(--muted);font-size:12.5px}
.tag{display:inline-block;margin-left:6px;padding:0 6px;border:1px dashed var(--muted);border-radius:4px;color:var(--muted);font-size:11px;font-weight:600;vertical-align:1px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.acts{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-weight:600;font-size:12.5px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.p-fail,.p-overdue{background:var(--bad-bg);color:var(--bad)}
.p-soon{background:var(--warn-bg);color:var(--warn)}
.p-ok{background:var(--ok-bg);color:var(--ok)}
.empty{border:1px dashed var(--line);border-radius:var(--radius);padding:28px 20px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.empty h2{font-size:17px;font-weight:600}
.empty p{color:var(--muted);max-width:60ch}
.empty .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}

/* Lịch thử */
.grp{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.grp-h{display:flex;justify-content:space-between;gap:8px;padding:9px 14px;background:var(--surface-2);font-size:12px;letter-spacing:.05em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.grp-h.bad{color:var(--bad)}
.srow{display:grid;grid-template-columns:48px minmax(0,1fr) auto auto;gap:6px 14px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.dblock{display:flex;flex-direction:column;align-items:center;line-height:1.15}
.dblock b{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.dblock span{font-size:11.5px;color:var(--muted);text-transform:uppercase}
.s-what{min-width:0}
.s-when{color:var(--muted);font-size:12.5px}

/* Cột phải */
.prof{overflow:hidden}
.banner{height:84px;background:radial-gradient(120px 70px at 18% 30%,var(--g1),transparent 70%),radial-gradient(160px 80px at 78% 20%,var(--g2),transparent 70%),radial-gradient(140px 70px at 55% 90%,var(--g3),transparent 70%),var(--surface-3)}
.prof-body{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
.avatar{width:64px;height:64px;border-radius:50%;margin-top:-32px;background:var(--surface);border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line);display:grid;place-items:center;color:var(--accent)}
.pname{font-size:18px;font-weight:600;line-height:1.25}
.handle{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;color:var(--muted);font-size:13px}
.r-actions{display:flex;gap:8px;flex-wrap:wrap}
.r-actions .btn{flex:1 1 0}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:var(--surface-2);border-radius:10px;padding:10px 12px;min-width:0}
.tile .k{color:var(--muted);font-size:12.5px}
.tile .v{font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}
.tile select{min-height:30px;padding:2px 6px;font-weight:600;font-size:14px;background:transparent;border-color:var(--line)}
.prog{background:var(--surface-2);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.prog-top{display:flex;justify-content:space-between;color:var(--muted);font-size:13px}
.prog-top b{color:var(--fg);font-variant-numeric:tabular-nums}
.pbar{position:relative;height:8px;border-radius:999px;background:linear-gradient(90deg,#D03B3B,#EDA100,#1BAF7A)}
.pbar i{position:absolute;top:50%;width:12px;height:12px;border-radius:50%;background:var(--surface);border:3px solid var(--fg);transform:translate(-50%,-50%)}
.rcard{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.rcard h3{font-size:14.5px;font-weight:600}
.up-row{display:flex;align-items:center;gap:12px}
.up-ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;border:1px solid var(--line);color:var(--c)}
.up-t{font-weight:500;min-width:0;overflow-wrap:anywhere}
.up-s{color:var(--muted);font-size:12.5px}
.week{border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:6px;background:radial-gradient(180px 100px at 90% 0%,var(--g2),transparent 70%),radial-gradient(160px 90px at 10% 110%,var(--g1),transparent 70%),var(--surface-2);border:1px solid var(--line)}
.week .wi{width:36px;height:36px;border-radius:10px;background:var(--surface);display:grid;place-items:center;color:var(--accent);margin-bottom:4px;border:1px solid var(--line)}
.week h3{font-size:15px;font-weight:600}
.week p{color:var(--muted);font-size:13px}

/* Hộp thoại */
dialog{border:1px solid var(--line);border-radius:16px;padding:0;width:min(640px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow:auto;background:var(--surface);color:var(--fg)}
dialog::backdrop{background:rgba(8,14,22,.55)}
.dlg-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.dlg-head h2{font-size:17px;font-weight:600}
.icon-btn{appearance:none;border:0;background:transparent;font-size:24px;line-height:1;width:36px;height:36px;border-radius:8px;cursor:pointer;color:var(--muted)}
.icon-btn:hover{background:var(--surface-2)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;padding:16px 18px}
.grid label{display:flex;flex-direction:column;gap:4px;min-width:0;font-weight:500;font-size:13px}
.grid .span{grid-column:1/-1}
.next{padding:8px 12px;background:var(--accent-soft);border-radius:8px;font-weight:600;font-variant-numeric:tabular-nums}
.err{margin:0 18px 12px;padding:8px 12px;border-radius:8px;background:var(--bad-bg);color:var(--bad);font-weight:500}
.hist{padding:0 18px 14px}
.hist h3{margin:0 0 6px;font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.hist ul{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:8px}
.hist li{padding:7px 12px;border-bottom:1px solid var(--line);font-size:13px;display:flex;flex-wrap:wrap;gap:2px 12px}
.hist li:last-child{border-bottom:0}
.hist p{color:var(--muted);font-size:13px}
.dlg-foot{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px 18px;border-top:1px solid var(--line);background:var(--surface-2)}
.dlg-foot .spacer{flex:1 1 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:10px;font-weight:500;z-index:70;max-width:calc(100vw - 32px)}

@media (max-width:1180px){
  .app{grid-template-columns:232px minmax(0,1fr)}
  .rail{grid-column:1/-1;border-left:0;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));align-items:start}
}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .only-narrow{display:inline-flex}
}
@media (max-width:760px){
  .view{padding:16px}
  .plantbar{padding:4px 16px 12px}
  .mhead{padding:12px 16px}
  .tabs{padding:0 16px}
  .notice{margin:0 16px 8px}
  .tbl-wrap{border:0;overflow:visible}
  .tbl{min-width:0}
  .tbl,.tbl tbody,.tbl tr,.tbl td{display:block}
  .tbl thead{display:none}
  .tbl tr{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--stripe,var(--line));border-radius:12px;margin-bottom:10px;padding:4px 0}
  .tbl td{display:flex;justify-content:space-between;gap:16px;border:0;padding:5px 12px;text-align:right;box-shadow:none!important}
  .tbl td::before{content:attr(data-label);color:var(--muted);text-align:left;flex:none}
  .tbl td.cell-acts{justify-content:flex-end}
  .tbl td.cell-acts::before{content:none}
  .srow{grid-template-columns:44px minmax(0,1fr)}
  .srow .pill,.srow .btn{grid-column:2;justify-self:start}
}
@media (max-width:560px){
  .grid{grid-template-columns:1fr}
  .kpi-val{font-size:30px}
  .bars{gap:4px}
  .arow{grid-template-columns:34px minmax(0,1fr)}
  .arow .badge{grid-column:2;justify-self:start}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body><div class="app">
  <aside class="side" id="side" aria-label="Bộ lọc nhanh"></aside>
  <main class="main" id="main"></main>
  <aside class="rail" id="rail" aria-label="Tóm tắt"></aside>
</div>

<dialog id="dlg" aria-labelledby="dlgTitle">
  <form id="f" novalidate>
    <div class="dlg-head">
      <h2 id="dlgTitle"></h2>
      <button type="button" class="icon-btn" id="dlgClose" aria-label="Đóng">&times;</button>
    </div>
    <div class="grid">
      <label for="fPlant" class="span"><span>Nhà máy</span>
        <select id="fPlant">
          <option value="">Chọn nhà máy</option>
          <option value="ialy">Nhà máy Ia Ly</option>
          <option value="ialymr">Nhà máy Ia Ly mở rộng</option>
        </select>
      </label>
      <label for="fType"><span>Loại thiết bị</span>
        <select id="fType">
          <option value="boot">Ủng cách điện</option>
          <option value="glove">Găng tay cách điện</option>
          <option value="pole">Sào cách điện</option>
          <option value="mat">Thảm cách điện</option>
        </select>
      </label>
      <label for="fSerial"><span>Số hiệu</span><input id="fSerial" type="text" autocomplete="off" maxlength="60"></label>
      <label for="fVolt"><span>Cấp điện áp</span><input id="fVolt" type="text" list="voltList" autocomplete="off" maxlength="30" placeholder="Ví dụ: 22 kV"></label>
      <label for="fLoc"><span>Đơn vị / vị trí sử dụng</span><input id="fLoc" type="text" autocomplete="off" maxlength="120"></label>
      <label for="fDate"><span>Ngày thử nghiệm</span><input id="fDate" type="date" min="2000-01-01" max="2100-12-31"></label>
      <label for="fCycle"><span>Chu kỳ thử (tháng)</span><input id="fCycle" type="number" min="1" max="60" step="1" inputmode="numeric"></label>
      <div class="span next" id="fNext" aria-live="polite"></div>
      <label for="fResult"><span>Kết quả</span>
        <select id="fResult"><option value="pass">Đạt</option><option value="fail">Không đạt</option></select>
      </label>
      <label for="fReport"><span>Số biên bản thử nghiệm</span><input id="fReport" type="text" autocomplete="off" maxlength="60"></label>
      <label for="fLab" class="span"><span>Đơn vị thử nghiệm</span><input id="fLab" type="text" autocomplete="off" maxlength="120"></label>
      <label for="fNote" class="span"><span>Ghi chú</span><textarea id="fNote" rows="2" maxlength="500"></textarea></label>
    </div>
    <datalist id="voltList"><option value="1 kV"></option><option value="6 kV"></option><option value="10 kV"></option><option value="22 kV"></option><option value="35 kV"></option><option value="110 kV"></option></datalist>
    <p class="err" id="fErr" role="alert" hidden></p>
    <div class="hist" id="hist" hidden></div>
    <div class="dlg-foot">
      <button type="button" class="btn danger" id="btnDel">Xóa thiết bị</button>
      <span class="spacer"></span>
      <button type="button" class="btn" id="btnCancel">Đóng</button>
      <button type="submit" class="btn primary" id="btnSave">Lưu</button>
    </div>
  </form>
</dialog>

<dialog id="gate" aria-labelledby="gateTitle">
  <form id="gateForm" novalidate>
    <div class="dlg-head"><h2 id="gateTitle">Nhập mã truy cập</h2></div>
    <div class="grid">
      <p class="span" style="margin:0;color:var(--muted)">Sổ dụng cụ cách điện dùng chung. Nhập mã do người quản lý sổ cấp để xem hoặc nhập liệu.</p>
      <p class="span" id="gateInfo" style="margin:0;color:var(--muted);font-size:12.5px;overflow-wrap:anywhere"></p>
      <label class="span" for="gateCode"><span>Mã truy cập</span><input id="gateCode" type="password" autocomplete="current-password" maxlength="100"></label>
    </div>
    <p class="err" id="gateErr" role="alert" hidden></p>
    <div class="dlg-foot"><span class="spacer"></span><button type="submit" class="btn primary">Vào sổ</button></div>
  </form>
</dialog>

<div class="tip" id="tip" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
(function(){
"use strict";

var TYPES={
  boot:{label:"Ủng cách điện",short:"Ủng",cycle:6,color:"var(--t-boot)",icon:"boot"},
  glove:{label:"Găng tay cách điện",short:"Găng",cycle:6,color:"var(--t-glove)",icon:"glove"},
  pole:{label:"Sào cách điện",short:"Sào",cycle:12,color:"var(--t-pole)",icon:"pole"},
  mat:{label:"Thảm cách điện",short:"Thảm",cycle:12,color:"var(--t-mat)",icon:"mat"}
};
var TYPE_KEYS=["boot","glove","pole","mat"];
var PLANTS={ialy:{label:"Nhà máy Ia Ly",short:"Ia Ly"},ialymr:{label:"Nhà máy Ia Ly mở rộng",short:"Ia Ly mở rộng"}};
var PLANT_KEYS=["ialy","ialymr"];
var LS_PLANT="ccdc.plant";
var RANK={fail:0,overdue:1,soon:2,ok:3};
var STATUS_LABEL={fail:"Không đạt",overdue:"Quá hạn",soon:"Sắp đến hạn",ok:"Còn hạn"};
var WEEKDAYS=["Chủ nhật","Thứ hai","Thứ ba","Thứ tư","Thứ năm","Thứ sáu","Thứ bảy"];
var WK_SHORT=["CN","T2","T3","T4","T5","T6","T7"];
var VIEWS=[["overview","tong-quan","Tổng quan","grid"],["list","danh-sach","Danh sách","list"],["schedule","lich-thu","Lịch thử","calendar"],["activity","hoat-dong","Hoạt động","activity"]];
var LS_ITEMS="ccdc.items.v1", LS_WARN="ccdc.warn", LS_CODE="ccdc.code";
/* Dán URL ứng dụng web của Google Apps Script (kết thúc bằng /exec) vào đây. */
var CONFIG={SCRIPT_URL:"https://script.google.com/macros/s/AKfycbydONARNASiPw4JjWPwHOawHgvfH086W6AS_26vH80wULDGRmioUcek0par3s6f89HWsg/exec"};
var BUILD="22/11-chẩn-đoán";

var S={items:[],loaded:false,note:"",mode:"pending",canWrite:true,view:"overview",status:"all",type:"all",q:"",warn:30,act:"all",syncedAt:null,plant:"all"};
var D={mode:"add",id:null,cycleTouched:false,delArmed:false};
var store=null,dlApi=null,loadTimer=null,toastTimer=null;

function $(id){return document.getElementById(id)}
function h(tag,props,kids){
  var e=document.createElement(tag);
  if(props){for(var k in props){
    var v=props[k];
    if(v===false||v==null)continue;
    if(k==="class")e.className=v;
    else if(k==="text")e.textContent=v;
    else if(k==="style")e.setAttribute("style",v);
    else if(k.slice(0,2)==="on")e.addEventListener(k.slice(2),v);
    else e.setAttribute(k,v===true?"":v);
  }}
  (kids||[]).forEach(function(c){if(c==null||c===false)return;e.appendChild(typeof c==="string"?document.createTextNode(c):c)});
  return e;
}

/* ---------- Biểu tượng ---------- */
var NS="http://www.w3.org/2000/svg";
var ICONS={
  plus:"M12 5v14M5 12h14",
  grid:"M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z",
  list:"M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01",
  calendar:"M7 3v4M17 3v4M4 9h16M5 5h14a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z",
  activity:"M3 12h4l3-8 4 16 3-8h4",
  download:"M12 4v11M7 11l5 5 5-5M5 20h14",
  search:"M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM20 20l-4-4",
  clock:"M12 4a8 8 0 1 0 0 16 8 8 0 0 0 0-16zM12 8v4l3 2",
  check:"M5 12l4 4 10-10",
  alert:"M12 4l9 16H3zM12 10v4M12 17h.01",
  ban:"M12 4a8 8 0 1 0 0 16 8 8 0 0 0 0-16zM6.3 6.3l11.4 11.4",
  bolt:"M13 3L5 14h6l-1 7 8-11h-6z",
  sparkle:"M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM18 16l.8 2.2L21 19l-2.2.8L18 22l-.8-2.2L15 19l2.2-.8z",
  shield:"M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z",
  info:"M12 4a8 8 0 1 0 0 16 8 8 0 0 0 0-16zM12 11v5M12 8h.01",
  filter:"M4 5h16l-6 8v6l-4-2v-4z",
  upright:"M7 17L17 7M9 7h8v8",
  boot:"M8 3v9l-3 3v4h14v-3l-5-3V3z",
  glove:"M8 13V6.5a1.5 1.5 0 0 1 3 0V11M11 5a1.5 1.5 0 0 1 3 0v6M14 6.5a1.5 1.5 0 0 1 3 0V14c0 4-2 7-6 7s-6-3-6-6l-1-3a1.5 1.5 0 0 1 3-1l1 2",
  pole:"M5 19L19 5M17 4l3 3M4 17l3 3",
  mat:"M4 9l3-3h13l-3 3zM4 9v8h13V9M17 17l3-3V6"
};
function ico(n,s){
  var sv=document.createElementNS(NS,"svg");
  sv.setAttribute("viewBox","0 0 24 24");sv.setAttribute("width",s||18);sv.setAttribute("height",s||18);
  sv.setAttribute("fill","none");sv.setAttribute("stroke","currentColor");sv.setAttribute("stroke-width","1.8");
  sv.setAttribute("stroke-linecap","round");sv.setAttribute("stroke-linejoin","round");sv.setAttribute("aria-hidden","true");
  var p=document.createElementNS(NS,"path");p.setAttribute("d",ICONS[n]||ICONS.info);sv.appendChild(p);
  return sv;
}
function ring(count,frac,color){
  var C=2*Math.PI*15,sv=document.createElementNS(NS,"svg");
  sv.setAttribute("viewBox","0 0 36 36");sv.setAttribute("width","38");sv.setAttribute("height","38");sv.setAttribute("class","ring");sv.setAttribute("aria-hidden","true");
  var bg=document.createElementNS(NS,"circle");
  [["cx","18"],["cy","18"],["r","15"],["fill","none"],["stroke","var(--line)"],["stroke-width","3.5"]].forEach(function(a){bg.setAttribute(a[0],a[1])});
  sv.appendChild(bg);
  if(frac>0){
    var fg=document.createElementNS(NS,"circle");
    [["cx","18"],["cy","18"],["r","15"],["fill","none"],["stroke",color],["stroke-width","3.5"],["stroke-linecap","round"],
     ["stroke-dasharray",(Math.max(frac,0.02)*C).toFixed(2)+" "+C.toFixed(2)],["transform","rotate(-90 18 18)"]].forEach(function(a){fg.setAttribute(a[0],a[1])});
    sv.appendChild(fg);
  }
  var t=document.createElementNS(NS,"text");
  t.setAttribute("x","18");t.setAttribute("y","22");t.setAttribute("text-anchor","middle");t.textContent=String(count);
  sv.appendChild(t);
  return sv;
}

/* ---------- Ngày tháng ---------- */
function pad(n){return n<10?"0"+n:""+n}
function isoOf(y,m,d){return y+"-"+pad(m)+"-"+pad(d)}
function todayISO(){var d=new Date();return isoOf(d.getFullYear(),d.getMonth()+1,d.getDate())}
function validISO(s){return typeof s==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&!isNaN(parseISO(s))}
function parseISO(s){var p=s.split("-");return Date.UTC(+p[0],+p[1]-1,+p[2])}
function diffDays(a,b){return Math.round((parseISO(a)-parseISO(b))/86400000)}
function addMonths(s,n){
  var p=s.split("-"),y=+p[0],m=+p[1]-1,d=+p[2];
  var t=new Date(Date.UTC(y,m+n,1));
  var ty=t.getUTCFullYear(),tm=t.getUTCMonth();
  var last=new Date(Date.UTC(ty,tm+1,0)).getUTCDate();
  return isoOf(ty,tm+1,Math.min(d,last));
}
function addDays(s,n){var t=new Date(parseISO(s)+n*86400000);return isoOf(t.getUTCFullYear(),t.getUTCMonth()+1,t.getUTCDate())}
function fmt(s){if(!validISO(s))return "—";var p=s.split("-");return p[2]+"/"+p[1]+"/"+p[0]}
function wkOf(s){return new Date(parseISO(s)).getUTCDay()}
function fold(s){return String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/đ/g,"d")}
function ago(ts){
  var m=Math.round((Date.now()-ts)/60000);
  if(m<1)return "vừa xong";
  if(m<60)return m+" phút trước";
  var hr=Math.round(m/60);if(hr<24)return hr+" giờ trước";
  var dd=Math.round(m/1440);if(dd<7)return dd+" ngày trước";
  var d=new Date(ts);return fmt(isoOf(d.getFullYear(),d.getMonth()+1,d.getDate()));
}

/* ---------- Trạng thái ---------- */
function typeLabel(t){return TYPES[t]?TYPES[t].label:"Thiết bị khác"}
function typeColor(t){return TYPES[t]?TYPES[t].color:"var(--muted)"}
function info(it){
  var cyc=parseInt(it.cycle,10);
  if(!(cyc>=1))cyc=TYPES[it.type]?TYPES[it.type].cycle:12;
  if(it.result==="fail")return {next:null,days:null,status:"fail"};
  if(!validISO(it.testDate))return {next:null,days:null,status:"overdue",bad:true};
  var next=addMonths(it.testDate,cyc),days=diffDays(next,todayISO());
  return {next:next,days:days,status:days<0?"overdue":(days<=S.warn?"soon":"ok")};
}
function rel(days){return days<0?"quá "+(-days)+" ngày":(days===0?"đến hạn hôm nay":"còn "+days+" ngày")}
function cmp(a,b){
  var d=RANK[a.i.status]-RANK[b.i.status];
  if(d)return d;
  var an=a.i.next||"9999-99-99",bn=b.i.next||"9999-99-99";
  if(an!==bn)return an<bn?-1:1;
  return String(a.it.serial||"").localeCompare(String(b.it.serial||""),"vi",{numeric:true});
}
function scoped(){return S.plant==="all"?S.items:S.items.filter(function(i){return i.plant===S.plant})}
function rows(){return scoped().map(function(it){return {it:it,i:info(it)}}).sort(cmp)}
function plantLabel(k){return PLANTS[k]?PLANTS[k].label:"Chưa gán nhà máy"}
function plantShort(k){return PLANTS[k]?PLANTS[k].short:"Chưa gán"}
function where(it){var p=(S.plant==="all"&&PLANTS[it.plant])?PLANTS[it.plant].short:"";return [p,it.location||""].filter(Boolean).join(" · ")}
function setPlant(p){S.plant=p;try{localStorage.setItem(LS_PLANT,p)}catch(e){}render()}
function plantBar(){
  var counts={all:S.items.length},bad={all:0};
  PLANT_KEYS.forEach(function(k){counts[k]=0;bad[k]=0});
  S.items.forEach(function(it){
    var st=info(it).status,b=(st==="overdue"||st==="fail");
    if(b)bad.all++;
    if(counts[it.plant]!=null){counts[it.plant]++;if(b)bad[it.plant]++}
  });
  var defs=[["all","Tất cả nhà máy"]].concat(PLANT_KEYS.map(function(k){return [k,PLANTS[k].label]}));
  return h("div",{class:"plantbar",role:"group","aria-label":"Chọn nhà máy"},defs.map(function(d){
    return h("button",{type:"button",class:"pbtn","aria-pressed":S.plant===d[0]?"true":"false",onclick:function(){setPlant(d[0])}},[
      h("span",{class:"pn",text:d[1]}),
      h("span",{class:"pc",text:String(counts[d[0]])}),
      bad[d[0]]?h("span",{class:"pbad",text:bad[d[0]]+" cần xử lý"}):null
    ]);
  }));
}
function plantCards(){
  var wrap=h("section",{style:"display:flex;flex-direction:column;gap:10px"},[
    h("div",{class:"sec-row"},[h("h2",{class:"sec",text:"Theo nhà máy"}),h("span",{class:"meta",text:"Bấm vào thẻ để mở dashboard riêng"})])
  ]);
  var grid=h("div",{class:"pcards"});
  PLANT_KEYS.forEach(function(k){

function makeDbStore(db){
  var coll=db.collection("equipment");
  return {
    subscribe:function(cb,err){
      return coll.onSnapshot(function(snap){
        var list=snap.docs.map(function(d){var o=Object.assign({},d.data());o.id=d.id;return o});
        cb(list,snap.metadata,snap.size);
      },err);
    },
    save:function(id,data){return coll.doc(id).set(data)},
    remove:function(id){return coll.doc(id).delete()}
  };
}
function makeLocalStore(){
  var items=[],listener=null;
  try{var raw=localStorage.getItem(LS_ITEMS);if(raw)items=JSON.parse(raw)||[]}catch(e){items=[]}
  function persist(){try{localStorage.setItem(LS_ITEMS,JSON.stringify(items))}catch(e){}}
  function emit(){if(listener)listener(items.slice(),{fromCache:false},items.length)}
  function idx(id){for(var i=0;i<items.length;i++)if(items[i].id===id)return i;return -1}
  return {
    subscribe:function(cb){listener=cb;emit();return function(){listener=null}},
    save:function(id,data){var o=Object.assign({},data);o.id=id;var i=idx(id);if(i<0)items.push(o);else items[i]=o;persist();emit();return Promise.resolve()},
    remove:function(id){var i=idx(id);if(i>=0)items.splice(i,1);persist();emit();return Promise.resolve()}
  };
}

var memCode="";
function getCode(){var c="";try{c=localStorage.getItem(LS_CODE)||""}catch(e){}return memCode||c}
function setCode(c){memCode=c;try{if(c)localStorage.setItem(LS_CODE,c);else localStorage.removeItem(LS_CODE)}catch(e){}}

function makeSheetStore(url){
  var listener=null,errCb=null,timer=null,items=[],busy=false,lastSig=null,hadError=false;
  function call(payload){
    payload.code=getCode();
    return fetch(url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)})
      .then(function(r){return r.text().then(function(txt){return {status:r.status,txt:txt}})})
      .then(function(x){
        var res;
        try{res=JSON.parse(x.txt)}catch(err){throw {code:"not_json",status:x.status,detail:x.txt.slice(0,400)}}
        if(!res||res.ok!==true)throw {code:(res&&res.error)||"server_error",detail:res&&res.message};
        return res;
      })
      .catch(function(e){
        if(e&&e.code)throw e;
        return fetch(url+"?probe=1",{mode:"no-cors"}).then(function(){return true},function(){return false}).then(function(reach){throw {code:reach?"cors":"network"}});
      });
  }
  function idx(id){for(var i=0;i<items.length;i++)if(items[i].id===id)return i;return -1}
  function emit(){lastSig=JSON.stringify(items);if(listener)listener(items.slice(),{fromCache:false},items.length)}
  function refresh(){
    if(!getCode()||busy)return Promise.resolve();
    busy=true;
    return call({action:"list"}).then(function(res){
      busy=false;
      S.canWrite=(res.role==="edit");
      var list=Array.isArray(res.items)?res.items:[];
      var sig=JSON.stringify(list);
      if(sig!==lastSig||hadError||!S.loaded){items=list;hadError=false;emit()}
    },function(e){busy=false;hadError=true;if(errCb)errCb(e)});
  }
  return {
    subscribe:function(cb,err){
      listener=cb;errCb=err;refresh();
      timer=setInterval(function(){if(document.visibilityState!=="hidden")refresh()},30000);
      return function(){listener=null;if(timer)clearInterval(timer)};
    },
    refresh:refresh,
    save:function(id,data){
      return call({action:"save",id:id,data:data}).then(function(){
        var o=Object.assign({},data);o.id=id;var i=idx(id);
        if(i<0)items.push(o);else items[i]=o;
        emit();
      });
    },
    remove:function(id){
      return call({action:"remove",id:id}).then(function(){
        var i=idx(id);if(i>=0)items.splice(i,1);emit();
      });
    }
  };
}

function describeErr(e){

  if(c==="not_json"){

    return "Apps Script trả về trang web thay vì dữ liệu (HTTP "+(e.status||"?")+"). Kiểm tra “Bất kỳ ai” đã được chọn và Code.gs đã được dán.";
  }
  if(c==="cors")return "Trình duyệt kết nối được tới Google nhưng Google không cho trang đọc kết quả. Nguyên nhân thường gặp: bản triển khai chưa để “Ai có quyền truy cập: Bất kỳ ai”, “Thực thi với tư cách” chưa là Tôi, hoặc chưa cấp quyền cho script. Thử mở địa chỉ /exec?action=list&code=sai bằng cửa sổ ẩn danh: nếu thấy trang đăng nhập Google thì đúng là chưa công khai.";
  if(c==="network")return "Trình duyệt không gọi được tới Google. Kiểm tra mạng, tắt tiện ích chặn quảng cáo, hoặc địa chỉ /exec trong trang bị sai.";
  if(c==="server_error")return "Apps Script báo lỗi"+(d?": "+d.slice(0,160):"")+". Nếu lỗi nhắc tới null hoặc getSheetByName, dự án chưa gắn với Google Sheet: hãy mở Apps Script từ trong Sheet (Tiện ích mở rộng → Apps Script).";
  if(c==="busy")return "Google Sheets đang bận. Danh sách sẽ tự cập nhật lại sau ít giây.";
  if(c==="read_only")return "Mã của bạn chỉ có quyền xem.";

  ["fPlant","fVolt","fLoc","fDate","fCycle","fResult","fReport","fLab","fNote"].forEach(function(k){$(k).disabled=ro});
  $("btnSave").hidden=ro;
  $("btnSave").textContent=mode==="add"?"Thêm vào sổ":(mode==="retest"?"Lưu kết quả thử":"Lưu thay đổi");
  $("btnDel").hidden=ro||mode!=="edit";
  $("btnDel").textContent="Xóa thiết bị";
  $("btnCancel").textContent=ro?"Đóng":"Hủy";
  renderHist(it,mode);updateNext();
  var dlg=$("dlg");
  try{dlg.showModal()}catch(e){dlg.setAttribute("open","")}
  if(!ro)setTimeout(function(){var f=mode==="add"?$("fSerial"):$("fDate");f.focus()},30);
}
function closeDlg(){var dlg=$("dlg");try{dlg.close()}catch(e){dlg.removeAttribute("open")}}

function onSubmit(ev){
  ev.preventDefault();
  if(!S.canWrite)return;
  var it=D.id?findItem(D.id):null;
  var plant=$("fPlant").value,type=$("fType").value,serial=$("fSerial").value.trim(),date=$("fDate").value,cyc=parseInt($("fCycle").value,10),err="";
  if(!PLANTS[plant])err="Chọn nhà máy.";
  else if(!TYPES[type])err="Chọn loại thiết bị.";
  else if(!serial)err="Nhập số hiệu thiết bị.";
  else if(!validISO(date))err="Nhập ngày thử nghiệm.";
  else if(date>todayISO())err="Ngày thử nghiệm không được sau hôm nay.";
  else if(!(cyc>=1&&cyc<=60))err="Chu kỳ thử phải từ 1 đến 60 tháng.";
  else if(D.mode==="retest"&&validISO(it.testDate)&&date<=it.testDate)err="Ngày thử mới phải sau lần thử gần nhất ("+fmt(it.testDate)+").";
  if(!err){
    var key=fold(serial);
    for(var i=0;i<S.items.length;i++){var o=S.items[i];
      if(o.id!==D.id&&o.type===type&&(o.plant||"")===plant&&fold(o.serial)===key){err="Số hiệu này đã có trong danh sách "+typeLabel(type).toLowerCase()+" của "+plantLabel(plant)+".";break}}
  }
  if(err){showErr(err);return}
  var now=new Date().toISOString();
  var hist=it&&Array.isArray(it.history)?it.history.slice():[];
  if(D.mode==="retest")hist.push({testDate:it.testDate||"",result:it.result==="fail"?"fail":"pass",report:it.report||"",lab:it.lab||"",cycle:it.cycle||cyc});
  var data={
    plant:plant,type:type,serial:serial,voltage:$("fVolt").value.trim(),location:$("fLoc").value.trim(),
    testDate:date,cycle:cyc,result:$("fResult").value==="fail"?"fail":"pass",
    report:$("fReport").value.trim(),lab:$("fLab").value.trim(),note:$("fNote").value.trim(),
    history:hist,createdAt:(it&&it.createdAt)||now,updatedAt:now,
    lastAction:D.mode==="add"?"add":(D.mode==="retest"?"test":"edit")
  };
  var id=D.id||newId(),btn=$("btnSave"),mode=D.mode;
  btn.disabled=true;showErr("");
  Promise.resolve(store.save(id,data)).then(function(){closeDlg();toast(mode==="add"?"Đã thêm "+serial:"Đã lưu "+serial)})
    .catch(function(ex){showErr(writeErrText(ex))})
    .then(function(){btn.disabled=false});
}
function onDelete(){
  var btn=$("btnDel");
  if(!D.delArmed){D.delArmed=true;btn.textContent="Bấm lần nữa để xóa";return}
  btn.disabled=true;
  Promise.resolve(store.remove(D.id)).then(function(){closeDlg();toast("Đã xóa thiết bị")})
    .catch(function(ex){showErr(writeErrText(ex));D.delArmed=false;btn.textContent="Xóa thiết bị"})
    .then(function(){btn.disabled=false});
}

/* ---------- Dữ liệu mẫu, xuất CSV ---------- */
function loadSamples(){
  var t=todayISO(),now=new Date().toISOString();
  function mk(type,serial,volt,loc,date,extra){
    return Object.assign({type:type,serial:serial,voltage:volt,location:loc,testDate:date,cycle:TYPES[type].cycle,result:"pass",report:"",lab:"",note:"",history:[],sample:true,createdAt:now,updatedAt:now,lastAction:"add"},extra||{});
  }
  var samples=[
    mk("boot","MẪU-U01","22 kV","Gian máy tổ máy H1",addMonths(t,-7),{plant:"ialy",history:[{testDate:addMonths(t,-13),result:"pass",report:"",lab:"",cycle:6}]}),
    mk("glove","MẪU-G01","22 kV","Phòng điều khiển trung tâm",addDays(addMonths(t,-6),12),{plant:"ialy"}),
    mk("pole","MẪU-S01","110 kV","Trạm phân phối ngoài trời",addMonths(t,-2),{plant:"ialymr"}),
    mk("mat","MẪU-T01","22 kV","Phòng điều khiển nhà máy mở rộng",addMonths(t,-4),{plant:"ialymr"})
  ];
  (function next(i){
    if(i>=samples.length){toast("Đã nạp dữ liệu mẫu");return}
    Promise.resolve(store.save(newId(),samples[i])).then(function(){next(i+1)}).catch(function(ex){toast(writeErrText(ex))});
  })(0);
}
function clearSamples(){
  var ids=S.items.filter(function(i){return i.sample===true}).map(function(i){return i.id});
  (function next(i){
    if(i>=ids.length){toast("Đã xóa dữ liệu mẫu");return}
    Promise.resolve(store.remove(ids[i])).then(function(){next(i+1)}).catch(function(ex){toast(writeErrText(ex))});
  })(0);
}
function csvCell(v){
  v=String(v==null?"":v).replace(/[\r\n]+/g," ");
  if(/^[=+\-@\t]/.test(v))v="'"+v;
  return '"'+v.replace(/"/g,'""')+'"';
}
function exportCsv(){
  var head=["Nhà máy","Loại thiết bị","Số hiệu","Cấp điện áp","Đơn vị / vị trí","Ngày thử nghiệm","Chu kỳ (tháng)","Hạn thử tiếp theo","Trạng thái","Kết quả","Số biên bản","Đơn vị thử nghiệm","Ghi chú"];
  var lines=[head.map(csvCell).join(",")];
  rows().forEach(function(r){var it=r.it;
    lines.push([plantLabel(it.plant),typeLabel(it.type),it.serial,it.voltage,it.location,fmt(it.testDate),it.cycle,r.i.next?fmt(r.i.next):"",STATUS_LABEL[r.i.status],it.result==="fail"?"Không đạt":"Đạt",it.report,it.lab,it.note].map(csvCell).join(","));
  });
  var fname="so-dung-cu-cach-dien-"+todayISO()+".csv",content="﻿"+lines.join("\r\n");
  if(dlApi){
    dlApi.save({filename:fname,data:content})
      .then(function(){toast("Đã lưu file CSV")})
      .catch(function(ex){if(!ex||ex.code!=="declined")toast("Không lưu được file CSV.")});
    return;
  }
  try{
    var blob=new Blob([content],{type:"text/csv;charset=utf-8"}),a=document.createElement("a");
    a.href=URL.createObjectURL(blob);a.download=fname;document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(function(){URL.revokeObjectURL(a.href)},2000);toast("Đã tạo file CSV");
  }catch(e){toast("Không tạo được file CSV.")}
}

/* ---------- Gợi ý khi rê chuột ---------- */
function setupTip(){
  var tip=$("tip");
  function show(el,x,y){tip.textContent=el.getAttribute("data-tip");tip.hidden=false;place(x,y)}
  function place(x,y){
    var w=tip.offsetWidth,hh=tip.offsetHeight;
    var left=Math.min(Math.max(8,x+12),window.innerWidth-w-8),top=y-hh-12;
    if(top<8)top=y+16;
    tip.style.left=left+"px";tip.style.top=top+"px";
  }
  document.addEventListener("mouseover",function(e){var t=e.target.closest&&e.target.closest("[data-tip]");if(t)show(t,e.clientX,e.clientY)});
  document.addEventListener("mousemove",function(e){if(!tip.hidden)place(e.clientX,e.clientY)});
  document.addEventListener("mouseout",function(e){var t=e.target.closest&&e.target.closest("[data-tip]");if(t&&!(e.relatedTarget&&t.contains(e.relatedTarget)))tip.hidden=true});
  document.addEventListener("focusin",function(e){var t=e.target.closest&&e.target.closest("[data-tip]");if(t){var r=t.getBoundingClientRect();show(t,r.left+r.width/2,r.top)}});
  document.addEventListener("focusout",function(){tip.hidden=true});
}

/* ---------- Vẽ lại ---------- */
function render(){
  var ae=document.activeElement,keepId=ae&&ae.id&&ae.id==="q"?ae.id:null,selS=0,selE=0;
  if(keepId){try{selS=ae.selectionStart;selE=ae.selectionEnd}catch(e){}}
  $("tip").hidden=true;
  renderSide();renderMain();renderRail();
  if(keepId){var el=$(keepId);if(el){el.focus();try{el.setSelectionRange(selS,selE)}catch(e){}}}
}

/* ---------- Khởi động ---------- */
function wire(){
  try{var w=parseInt(localStorage.getItem(LS_WARN),10);if([15,30,45,60].indexOf(w)>=0)S.warn=w}catch(e){}
  try{var pl=localStorage.getItem(LS_PLANT);if(PLANTS[pl])S.plant=pl}catch(e){}
  var hv=viewFromHash();if(hv)S.view=hv;
  window.addEventListener("hashchange",function(){var v=viewFromHash();if(v&&v!==S.view){S.view=v;render()}});
  $("f").addEventListener("submit",onSubmit);
  $("btnDel").addEventListener("click",onDelete);
  $("btnCancel").addEventListener("click",closeDlg);
  $("dlgClose").addEventListener("click",closeDlg);
  $("dlg").addEventListener("click",function(e){if(e.target===this)closeDlg()});
  $("fType").addEventListener("change",function(){if(!D.cycleTouched&&TYPES[this.value])$("fCycle").value=TYPES[this.value].cycle;updateNext()});
  $("fCycle").addEventListener("input",function(){D.cycleTouched=true;updateNext()});
  $("fDate").addEventListener("input",updateNext);
  $("fDate").addEventListener("change",updateNext);
  $("fResult").addEventListener("change",updateNext);
  $("gate").addEventListener("cancel",function(e){e.preventDefault()});
  $("gateForm").addEventListener("submit",function(ev){
    ev.preventDefault();
    var c=$("gateCode").value.trim();
    if(!c){$("gateErr").hidden=false;$("gateErr").textContent="Nhập mã truy cập.";return}
    setCode(c);S.loaded=false;S.note="";closeGate();render();
    if(store&&store.refresh)store.refresh();
  });
  setupTip();
}

async function init(){
  wire();render();
  var db=null,user=null;
  try{
    if(window.claude&&typeof window.claude.use==="function"){
      db=await window.claude.use("db");
      try{user=await window.claude.use("user")}catch(e){}
      try{var dl=await window.claude.use("downloads");dlApi=dl&&typeof dl.save==="function"?dl:null}catch(e){}
    }
  }catch(e){db=null}
  if(db){
    S.mode="db";store=makeDbStore(db);
    try{if(user&&typeof user.can==="function"){var cw=await Promise.resolve(user.can("data.write"));if(cw===false)S.canWrite=false}}catch(e){}
    loadTimer=setTimeout(function(){
      if(!S.loaded){S.loaded=true;S.note="Chưa kết nối được kho dữ liệu chung. Danh sách có thể chưa phải bản mới nhất.";render()}
    },10000);
    store.subscribe(onData,onDbError);
  }else if(CONFIG.SCRIPT_URL){
    S.mode="sheet";store=makeSheetStore(CONFIG.SCRIPT_URL);
    store.subscribe(onData,onSheetError);
    if(getCode()){
      loadTimer=setTimeout(function(){
        if(!S.loaded){S.loaded=true;S.note="Google Sheets phản hồi chậm. Danh sách sẽ tự cập nhật khi có dữ liệu.";render()}
      },15000);
    }else openGate("");
  }else{
    S.mode="local";store=makeLocalStore();store.subscribe(onData);
  }
  render();
}
init();
})();
</script>
